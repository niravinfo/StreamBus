name: Build

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, ready_for_review]
  workflow_dispatch:

# The build workflow never needs to write to the repository.
permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build / Unit test / Pack
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore StreamBus.slnx

      - name: Build (Release)
        run: dotnet build StreamBus.slnx --no-restore --configuration Release

      - name: Unit tests
        # Classic VSTest mode (Directory.Build.props sets IsTestingPlatformApplication=false),
        # so `dotnet test <project>` is the supported invocation.
        run: >
          dotnet test tests/StreamBus.UnitTests/StreamBus.UnitTests.csproj
          --no-build --configuration Release
          --logger "trx;LogFileName=unit.trx"
          --results-directory ./artifacts/test-results

      - name: Upload unit test results
        if: always()
        # Artifact upload is diagnostics, not a gate: a storage quota problem must
        # never fail the build (and with it skip the integration job).
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results
          path: ./artifacts/test-results/*.trx
          if-no-files-found: warn
          retention-days: 3

      - name: Pack (verify packaging)
        run: |
          set -euo pipefail
          dotnet pack StreamBus.slnx --no-build --configuration Release --output ./artifacts
          ls -lh ./artifacts/
          # The packages are verified here rather than through the artifact upload,
          # which is not allowed to fail the job.
          shopt -s nullglob
          packages=(./artifacts/*.nupkg)
          symbols=(./artifacts/*.snupkg)
          if [ "${#packages[@]}" -ne 1 ] || [ "${#symbols[@]}" -ne 1 ]; then
            echo "::error::expected exactly one .nupkg and one .snupkg, found ${#packages[@]} and ${#symbols[@]}"
            exit 1
          fi

      - name: List packages
        run: ls -lh ./artifacts/

      - name: Upload packages artifact (for inspection)
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: ./artifacts/*.nupkg
          if-no-files-found: error
          retention-days: 3

  integration-tests:
    name: Integration tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Docker is available on ubuntu-latest, and the integration suite starts
    # its own pinned RabbitMQ broker via Testcontainers, so no broker setup
    # is needed here.
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore StreamBus.slnx

      - name: Build (Release)
        run: dotnet build StreamBus.slnx --no-restore --configuration Release

      - name: Integration tests
        run: >
          dotnet test tests/StreamBus.IntegrationTests/StreamBus.IntegrationTests.csproj
          --no-build --configuration Release
          --logger "trx;LogFileName=integration.trx"
          --results-directory ./artifacts/test-results

      - name: Upload test results
        if: always()
        # Diagnostics only: a storage quota problem must never fail this job.
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-results
          path: ./artifacts/test-results/*.trx
          if-no-files-found: warn
          retention-days: 7
