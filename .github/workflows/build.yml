name: Build

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, ready_for_review]
  workflow_dispatch:

# The build workflow never needs to write to the repository.
permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build / Unit test / Pack
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x
            11.0.x

      - name: Restore
        run: dotnet restore StreamBus.slnx

      - name: Build (Release)
        run: dotnet build StreamBus.slnx --no-restore --configuration Release

      - name: Build docs snippets (net10.0 / net11.0)
        # DocsSnippets is intentionally not in StreamBus.slnx, so restore it explicitly.
        run: |
          dotnet restore tests/StreamBus.DocsSnippets/StreamBus.DocsSnippets.csproj
          dotnet build tests/StreamBus.DocsSnippets/StreamBus.DocsSnippets.csproj --no-restore --configuration Release

      - name: Unit tests (net10.0)
        # Classic VSTest mode (Directory.Build.props sets IsTestingPlatformApplication=false),
        # so `dotnet test <project>` is the supported invocation.
        run: >
          dotnet test tests/StreamBus.UnitTests/StreamBus.UnitTests.csproj
          --no-build --configuration Release --framework net10.0
          --logger "trx;LogFileName=unit-net10.trx"
          --results-directory ./artifacts/test-results

      - name: Unit tests (net11.0)
        run: >
          dotnet test tests/StreamBus.UnitTests/StreamBus.UnitTests.csproj
          --no-build --configuration Release --framework net11.0
          --logger "trx;LogFileName=unit-net11.trx"
          --results-directory ./artifacts/test-results

      - name: Upload unit test results
        if: always()
        # Artifact upload is diagnostics, not a gate: a storage quota problem must
        # never fail the build (and with it skip the integration job).
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results
          path: ./artifacts/test-results/unit-*.trx
          if-no-files-found: warn
          retention-days: 3

      - name: Pack (verify packaging)
        run: |
          set -euo pipefail
          dotnet pack StreamBus.slnx --no-build --configuration Release --output ./artifacts
          ls -lh ./artifacts/
          # The packages are verified here rather than through the artifact upload,
          # which is not allowed to fail the job.
          shopt -s nullglob
          packages=(./artifacts/*.nupkg)
          symbols=(./artifacts/*.snupkg)
          if [ "${#packages[@]}" -ne 1 ] || [ "${#symbols[@]}" -ne 1 ]; then
            echo "::error::expected exactly one .nupkg and one .snupkg, found ${#packages[@]} and ${#symbols[@]}"
            exit 1
          fi
          # Both target assets must be present in the single package.
          unzip -l ./artifacts/*.nupkg | grep -q 'lib/net10.0/StreamBus.dll'
          unzip -l ./artifacts/*.nupkg | grep -q 'lib/net11.0/StreamBus.dll'

      - name: List packages
        run: ls -lh ./artifacts/

      - name: Verify packed net10 asset (smoke consumer)
        # A ProjectReference exercises TFM selection at the project level, not
        # NuGet dependency-group resolution. This consumes the packed .nupkg
        # from a local feed the way an unchanged .NET 10 consumer would.
        run: |
          set -euo pipefail
          version=$(basename ./artifacts/*.nupkg .nupkg | sed 's/^StreamBus\.//')
          work=$(mktemp -d)
          dotnet new console --framework net10.0 --no-restore -o "$work/smoke"
          dotnet add "$work/smoke/smoke.csproj" package StreamBus \
            --version "$version" --source "$GITHUB_WORKSPACE/artifacts"
          cat > "$work/smoke/Program.cs" <<'EOF'
          using StreamBus;
          var options = new StreamBusHostOptions();
          Console.WriteLine($"net10 consumer resolved StreamBus: WaitUntilStarted={options.WaitUntilStarted}");
          EOF
          dotnet run --project "$work/smoke/smoke.csproj" --configuration Release

      - name: Upload packages artifact (for inspection)
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: ./artifacts/*.nupkg
          if-no-files-found: error
          retention-days: 3

  integration-tests:
    name: Integration tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Docker is available on ubuntu-latest, and the integration suite starts
    # its own pinned RabbitMQ broker via Testcontainers, so no broker setup
    # is needed here.
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x
            11.0.x

      - name: Restore
        run: dotnet restore StreamBus.slnx

      - name: Build (Release)
        run: dotnet build StreamBus.slnx --no-restore --configuration Release

      - name: Integration tests (net10.0)
        run: >
          dotnet test tests/StreamBus.IntegrationTests/StreamBus.IntegrationTests.csproj
          --no-build --configuration Release --framework net10.0
          --logger "trx;LogFileName=integration-net10.trx"
          --results-directory ./artifacts/test-results

      - name: Integration tests (net11.0)
        run: >
          dotnet test tests/StreamBus.IntegrationTests/StreamBus.IntegrationTests.csproj
          --no-build --configuration Release --framework net11.0
          --logger "trx;LogFileName=integration-net11.trx"
          --results-directory ./artifacts/test-results

      - name: Upload test results
        if: always()
        # Diagnostics only: a storage quota problem must never fail this job.
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-results
          path: ./artifacts/test-results/integration-*.trx
          if-no-files-found: warn
          retention-days: 7
