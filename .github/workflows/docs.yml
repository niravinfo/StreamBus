name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build library XML docs
        run: dotnet build src/StreamBus -v q
      # The generated API reference pages are committed; regenerating them in
      # CI and failing on any diff keeps the checked-in pages from drifting
      # from the source XML doc comments.
      - name: Generate API reference
        run: dotnet run --project tools/ApiDocsGen -- src/StreamBus/bin/Debug/net10.0/StreamBus.xml docs/src/content/docs/api
      - name: Check API reference freshness
        run: git diff --exit-code -- docs/src/content/docs/api
      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.1
        with:
          # pnpm/action-setup only auto-detects the version from a root-level
          # package.json "packageManager" field; ours lives in docs/, so the
          # version must be pinned here. Keep in sync with docs/package.json.
          version: 12.16.1
      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: docs
      - name: Build docs
        run: pnpm build
        working-directory: docs
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: docs/dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
